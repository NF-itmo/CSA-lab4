in_src: |
  \ Эхо через внешнее IRQ:
  \ устройство 0 поднимает IRQ, значение приходит на стек в interruption_0
  \ если значение != 0 -> тут же отправляем обратно в устройство 0
  \ если значение == 0 -> ставим флаг завершения и выходим из idle-цикла

  variable done
  0 done !

  : interruption_0
      dup if
          0 out
      else
          drop
          1 done !
      then
  ;

  : idle
      1 do
          done @ if
              0
          else
              1
          then
      loop
  ;

  idle
  bye
