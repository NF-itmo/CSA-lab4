in_src: |
  \ Печать Hello World через программное прерывание
  1 constant INT_PUTC
  0 constant OUT_PORT

  "Hello World!" constant msg

  \ ( addr -- ) вывести null-terminated строку
  : puts0
      1 do
          dup @ dup if
              INT_PUTC int
              1+
              1
          else
              drop
              drop
              0
          then
      loop
  ;

  msg puts0
  bye

  \ INT 1: запись байта в порт 0
  : interruption_1
      OUT_PORT out
  ;
in_simulation_conf: |
  limit: 100000
  memory_size: 256
  result:
  - name: Check results
    slice: last
    view: |
      pmio-0-device-output: {pmio:0:output:sym}
    assert: |
      pmio-0-device-output: "Hello World!"
