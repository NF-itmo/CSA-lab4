in_src: |-
  \ Диалог через внешние прерывания:
  \ > What is your name?
  \ < Alice
  \ > Hello, Alice!

  "What is your name?" constant ask
  "Hello, " constant greet
  "!" constant bang

  10 allot name

  variable ptr
  name ptr !

  variable done
  0 done !

  \ interruption_0 получает символ от внешнего устройства 0:
  \ - если символ != 0: пишем в буфер имени и двигаем ptr
  \ - если символ == 0: пишем null и поднимаем done
  : interruption_0
      dup if
          ptr @ !
          ptr @ 1+ ptr !
      else
          ptr @ !
          1 done !
      then
  ;

  \ interruption_1 печатает символ в устройство 0
  : interruption_1
      0 out
  ;

  \ puts0: печать null-terminated строки через software int 1
  : puts0
      1 do
          dup @ dup if
              1 int
              1+
              1
          else
              drop
              drop
              0
          then
      loop
  ;

  \ ждём done=1 (пока interruption_0 не получит null)
  : wait_done
      1 do
          done @ if
              0
          else
              1
          then
      loop
  ;

  ask puts0
  wait_done
  greet puts0
  name puts0
  bang puts0
  bye
in_simulation_conf: |
  limit: 300000
  memory_size: 256
  port_mapped_io:
    0:
    - - 300
      - A
    - - 450
      - l
    - - 600
      - i
    - - 750
      - c
    - - 900
      - e
    - - 1050
      - 0
  result:
  - name: Instruction trace
    slice: all
    head: 15
    tail: 15
    view: |-
      PC: {PC:dec} - int: {DI:bool} - {instruction:str}
      D0: {D0:hex} - D1: {D1:hex} - D2: {D2:hex} - A0: {A0:hex} - A1: {A1:hex}
  - name: Check results
    slice: last
    view: |-
      pmio-0-device-input: {pmio:0:input:sym}
      pmio-0-device-output: {pmio:0:output:sym}
    assert: |-
      pmio-0-device-input: ""
      pmio-0-device-output: "What is your name?Hello, Alice!"
