in_src: |
  \ Сортировка через внешние прерывания:
  \ 1) interruption_0 собирает вход в массив до '\0'
  \ 2) после '\0' ставит done=1 (выход из idle)
  \ 3) дальше запускается пузырьковая сортировка и вывод в порт 0

  0 constant PORT0
  4 constant CELL

  16 allot arr
  variable wr_ptr
  variable cnt
  variable done

  variable i
  variable j
  variable va
  variable vb

  arr wr_ptr !
  0 cnt !
  0 done !

  \ arr_addr: idx -> byte address of a 32-bit cell
  : arr_addr
      CELL * arr +
  ;

  \ arr_at: idx -> value
  : arr_at
      arr_addr @
  ;

  \ arr_set: value idx -> ()
  : arr_set
      arr_addr !
  ;

  \ IRQ input handler (device 0)
  : interruption_0
      dup if
          dup wr_ptr @ !
          wr_ptr @ CELL + wr_ptr !
          cnt @ 1+ cnt !
          drop
      else
          drop
          1 done !
      then
  ;

  \ Ждём, пока interruption_0 выставит done=1
  : idle
      1 do
          done @ if
              0
          else
              1
          then
      loop
  ;

  \ Один полный проход пузырька по [0..cnt-2]
  : bubble_pass
      0 j !
      1 do
          j @ cnt @ 1- < if
              j @ arr_at va !
              j @ 1+ arr_at vb !
              va @ vb @ > if
                  vb @ j @ arr_set
                  va @ j @ 1+ arr_set
              then
              j @ 1+ j !
              1
          else
              0
          then
      loop
  ;

  \ Полная пузырьковая сортировка
  : bubble_sort
      0 i !
      1 do
          i @ cnt @ < if
              bubble_pass
              i @ 1+ i !
              1
          else
              0
          then
      loop
  ;

  \ Вывод отсортированного массива в порт 0
  : print_arr
      0 j !
      1 do
          j @ cnt @ < if
              j @ arr_at
              PORT0 out
              j @ 1+ j !
              1
          else
              0
          then
      loop
  ;

  idle
  bubble_sort
  print_arr
  bye
in_simulation_conf: |
  limit: 300000
  memory_size: 256
  port_mapped_io:
    0:
    - - 200
      - 9
    - - 350
      - 1
    - - 500
      - 4
    - - 650
      - 2
    - - 800
      - 8
    - - 1050
      - 0x0
  result:
  - name: Check results
    slice: last
    view: |
      pmio-0-device-input: {pmio:0:input:dec}
      pmio-0-device-output: {pmio:0:output:dec}
    assert: |
      pmio-0-device-input: []
      pmio-0-device-output: [1, 2, 4, 8, 9]
