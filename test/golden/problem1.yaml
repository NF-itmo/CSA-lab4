in_src: |
  \ Largest palindrome made from product of two 3-digit numbers.
  \
  \ Optimized idea:
  \   1. Generate 6-digit palindromes from the high half h:
  \      h=906 -> 906609
  \   2. Test divisors from 990 down, only multiples of 11
  \   3. Because palindromes are checked descending, the first factorization wins

  1 constant INT_PUTC

  999 constant MAX_FACTOR
  990 constant MAX_DIVISOR
  1000 constant THOUSAND
  100 constant HUNDRED
  11 constant ELEVEN
  10 constant TEN

  100000 constant P5
  10000 constant P4
  1000 constant P3
  100 constant P2
  10 constant P1

  variable h
  variable p
  variable i
  variable q

  variable hi10
  variable a
  variable b
  variable c

  variable found
  variable rem
  variable digit

  \ IRQ/INT #1: write one symbol to device 0
  : interruption_1
      0 out
  ;

  \ h -> p, where h=abc and p=abccba
  : make_pal
      h @ TEN / hi10 !
      h @ HUNDRED / a !
      hi10 @ a @ TEN * - b !
      h @ hi10 @ TEN * - c !

      h @ THOUSAND * p !
      p @ c @ HUNDRED * + p !
      p @ b @ TEN * + p !
      p @ a @ + p !
  ;

  \ Search one palindrome p for a 3-digit factorization.
  : test_pal
      MAX_DIVISOR i !
      i @ 99 > do
          p @ i @ / q !

          q @ THOUSAND < if
              q @ 99 > if
                  q @ i @ * p @ = if
                      1 found !
                      99 i !
                  then
              then
          else
              99 i !
          then

          i @ ELEVEN - i !
          i @ 99 >
      loop
  ;

  \ ( place -- ) emit one decimal digit from rem and update rem
  : emit_place
      dup rem @ swap / digit !
      digit @ 48 + INT_PUTC int
      digit @ * rem @ swap - rem !
  ;

  \ Print p as 6 decimal digits
  : print_answer
      p @ rem !
      P5 emit_place
      P4 emit_place
      P3 emit_place
      P2 emit_place
      P1 emit_place
      rem @ 48 + INT_PUTC int
  ;

  0 found !
  MAX_FACTOR h !

  h @ 99 > do
      make_pal
      test_pal

      found @ if
          99 h !
      else
          h @ 1 - h !
      then
      h @ 99 >
  loop

  print_answer
  bye
