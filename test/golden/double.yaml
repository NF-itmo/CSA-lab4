in_src: |
  \ Double precision demo over two machine words:
  \ (A_HI:A_LO) + (B_HI:B_LO) -> hi:lo
  \ A_LO = 0xFFFFFFF6, B_LO = 20, so low word wraps to 10 and carry increments hi.

  1 constant INT_PUTC

  1000000000 constant P9

  1 constant A_HI
  4294967286 constant A_LO
  2 constant B_HI
  20 constant B_LO

  variable hi
  variable lo
  variable carry
  variable tmp
  variable digit
  variable div
  variable started

  : interruption_1
      0 out
  ;

  : putc
      INT_PUTC int
  ;

  : print_u
      tmp !
      P9 div !
      0 started !

      div @ 0 > do
          tmp @ div @ / digit !
          digit @ started @ + if
              digit @ 48 + putc
              1 started !
          then

          digit @ div @ * tmp @ swap - tmp !
          div @ 10 / div !
          div @ 0 >
      loop

      started @ 0 = if
          48 putc
      then
  ;

  : carry_if_lo_nonnegative
      lo @ 0 < if
      else
          1 carry !
      then
  ;

  : add64
      A_LO B_LO + lo !
      0 carry !

      A_LO 0 < if
          B_LO 0 < if
              1 carry !
          else
              carry_if_lo_nonnegative
          then
      else
          B_LO 0 < if
              carry_if_lo_nonnegative
          then
      then

      A_HI B_HI + carry @ + hi !
  ;

  add64
  hi @ print_u
  58 putc
  lo @ print_u
  bye
