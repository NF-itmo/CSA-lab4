in_src: |
  \ Демонстрация арифметики двойной точности для двух 32-битных машинных слов
  \ Складываем:
  \   A = 0x00000001_FFFFFFF6
  \   B = 0x00000002_00000014
  \ Ожидаемый результат: 0x00000004_0000000A

  1 constant INT_PUTC

  1 constant A_HI
  4294967286 constant A_LO
  2 constant B_HI
  20 constant B_LO

  268435456 constant H7
  16777216 constant H6
  1048576 constant H5
  65536 constant H4
  4096 constant H3
  256 constant H2
  16 constant H1
  1 constant H0

  variable hi
  variable lo
  variable carry
  variable digit
  variable rem

  : interruption_1
      0 out
  ;

  : putc
      INT_PUTC int
  ;

  : emit_hex_digit
      digit @ 10 < if
          digit @ 48 + putc
      else
          digit @ 55 + putc
      then
  ;

  : emit_hex_place
      dup rem @ swap / digit !
      emit_hex_digit
      digit @ * rem @ swap - rem !
  ;

  : print_hex32
      rem !
      H7 emit_hex_place
      H6 emit_hex_place
      H5 emit_hex_place
      H4 emit_hex_place
      H3 emit_hex_place
      H2 emit_hex_place
      H1 emit_hex_place
      H0 emit_hex_place
  ;

  : carry_if_lo_nonnegative
      lo @ 0 < if
      else
          1 carry !
      then
  ;

  : add64
      A_LO B_LO + lo !
      0 carry !

      A_LO 0 < if
          B_LO 0 < if
              1 carry !
          else
              carry_if_lo_nonnegative
          then
      else
          B_LO 0 < if
              carry_if_lo_nonnegative
          then
      then

      A_HI B_HI + carry @ + hi !
  ;

  add64
  48 putc
  120 putc
  hi @ print_hex32
  95 putc
  lo @ print_hex32
  bye
