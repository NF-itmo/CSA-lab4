in_src: |-
  \ POLY: 1 + 2*x + 3*x^2
  \ при x=2 ответ 17;
  1 constant INT_PUTC

  : interruption_1
      0 out
  ;

  2 poly 2 1 2 3
  INT_PUTC int
  bye
in_simulation_conf: |
  limit: 100000
  memory_size: 256
  result:
  - name: Instruction trace
    slice: all
    head: 15
    tail: 15
    view: |-
      PC: {PC:dec} - int: {DI:bool} - {instruction:str}
      D0: {D0:hex} - D1: {D1:hex} - D2: {D2:hex} - A0: {A0:hex} - A1: {A1:hex}
  - name: Check results
    slice: last
    view: 'pmio-0-device-output: {pmio:0:output:dec}'
    assert: 'pmio-0-device-output: [17]'
