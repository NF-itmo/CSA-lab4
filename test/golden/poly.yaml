in_src: |
  \ POLY test: 1 + 2*x + 3*x^2 for x=2 gives 17; +48 prints ASCII A.
  1 constant INT_PUTC

  : interruption_1
      0 out
  ;

  2 poly 2 1 2 3
  48 +
  INT_PUTC int
  bye
in_simulation_conf: |
  limit: 100000
  memory_size: 256
  result:
  - name: Check results
    slice: last
    view: |
      pmio-0-device-output: {pmio:0:output:sym}
    assert: |
      pmio-0-device-output: "A"
out_code_binary_hex: |-
